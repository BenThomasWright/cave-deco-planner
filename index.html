<style>
/* === DESIGN TOKENS: Dark cave-water palette === */

  --text: #dde4f0;

  --accent: #00c8f0;
  --accent-dim: #0a6a80;
  --success: #00c87a;
  --warn: #f0b800;
  --danger: #f04848;
  --stop6: #00c87a;
  --stop9: #48c840;
  --stop12: #90c020;
  --stop15: #c8a000;
  --stop21: #e07000;
  --stop30: #f04848;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f0f4fa;
    --surface: #ffffff;
    --card: #f8faff;
    --border: #d0d8ec;
    --text: #1a2040;
    --muted: #607090;
    --accent: #0080a8;
    --accent-dim: #d0eef8;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f0f4fa; --surface: #ffffff; --card: #f8faff;
  --border: #d0d8ec; --text: #1a2040; --muted: #607090;
  --accent: #0080a8; --accent-dim: #d0eef8; color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  overflow-x: hidden;
}

.mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

/* === LAYOUT === */
.app { display: flex; flex-direction: column; height: 100%; min-height: 100vh; }

.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 12px;
  height: 52px; flex-shrink: 0; position: sticky; top: 0; z-index: 10;
}
.header-title { font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; margin-right: 8px; }
.header-spacer { flex: 1; }

.main {
  display: grid;
  grid-template-columns: var(--left-w, 280px) 6px 1fr 6px var(--right-w, 300px);
  grid-template-rows: 1fr;
  flex: 1;
  min-height: 0;
  gap: 0;
}
@media (max-width: 900px) {
  .main { display: flex; flex-direction: column; overflow-y: auto; }
  .resize-handle { display: none; }
}

.panel {
  overflow-y: auto;
  padding: 14px max(16px, env(safe-area-inset-left, 0px));
  padding-right: 14px;
  border-right: none;
}
@media (max-width: 900px) {
  .panel { border-bottom: 1px solid var(--border); overflow-y: visible; }

}

.resize-handle {

  cursor: col-resize;
  transition: background 0.15s;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}

  content: '';
  display: block;

.section { margin-bottom: 18px; }

.btn-primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

.btn-sm { padding: 3px 8px; font-size: 12px; }
.btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

.seg-group { display: flex; gap: 0; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ═══════════════════════════════════════════════════════
// BÜHLMANN ZHL-16C CONSTANTS
// ═══════════════════════════════════════════════════════
const N2_HT  = [5,8,12.5,18.5,27,38.3,54.3,77,109,146,187,239,305,390,498,635];
const HE_HT  = [1.88,3.02,4.72,6.99,10.21,14.48,20.53,29.11,41.2,55.19,70.69,90.34,115.29,147.42,188.24,240.03];
const N2_A   = [1.1696,1.0,0.8618,0.7562,0.62,0.5043,0.441,0.4,0.375,0.35,0.3295,0.3065,0.2835,0.261,0.248,0.2327];
const N2_B   = [0.5578,0.6514,0.7222,0.7825,0.8126,0.8434,0.8693,0.891,0.9092,0.9222,0.9319,0.9403,0.9477,0.9544,0.9602,0.9653];
const HE_A   = [1.6189,1.383,1.1919,1.0458,0.922,0.8205,0.7305,0.6502,0.595,0.5545,0.5333,0.5189,0.5181,0.5176,0.5172,0.5119];
const HE_B   = [0.477,0.5747,0.6527,0.7223,0.7582,0.7957,0.8279,0.8553,0.8757,0.8903,0.8997,0.9073,0.9122,0.9171,0.9217,0.9267];

const SURFACE_P = 1.01325; // bar
const P_H2O     = 0.0627;  // bar water vapor in lungs
const STOP_SIZE = 3;       // m
const ASCENT_RATE_DEFAULT = 9; // m/min

// ═══════════════════════════════════════════════════════
// PHYSICS HELPERS
// ═══════════════════════════════════════════════════════
const ambBar = (depth, salt) => SURFACE_P + depth * (salt ? 0.1 : 0.09804);
const barToM  = (bar,  salt) => Math.max(0, (bar - SURFACE_P) / (salt ? 0.1 : 0.09804));

function alveolarPP(gas, pamb, mode, setpoint, diluent) {
  // Returns {ppN2, ppHe} for use in Bühlmann tissue update
  // fN2 is derived — gas objects only store fO2 and fHe
  const fN2of = (g) => Math.max(0, 1 - (g.fO2 || 0) - (g.fHe || 0));
  const pamb_dry = pamb - P_H2O;
  if (mode === 'ccr') {
    const g = diluent || gas;
    const ppO2 = Math.min(setpoint, pamb_dry);
    const pInert = Math.max(0, pamb_dry - ppO2);
    const gN2 = fN2of(g);
    const gHe = g.fHe || 0;
    const totalInert = gN2 + gHe;
    if (totalInert <= 0) return { ppN2: 0, ppHe: 0 };
    return { ppN2: pInert * gN2 / totalInert, ppHe: pInert * gHe / totalInert };
  } else {
    return { ppN2: pamb_dry * fN2of(gas), ppHe: pamb_dry * (gas.fHe || 0) };
  }
}

function gasName(g) {
  if (!g) return '—';
  const o2 = Math.round(g.fO2 * 100);
  const he = Math.round(g.fHe * 100);
  if (he > 0) return `TMX${o2}/${he}`;
  if (o2 === 21) return 'Air';
  if (o2 === 100) return 'O₂';
  return `EANx${o2}`;
}

function gasMOD(g, maxPpO2 = 1.6) {
  if (g.fO2 <= 0) return 999;
  return Math.floor((maxPpO2 / g.fO2 - SURFACE_P) / 0.1);
}

const GAS_COLORS = ['#00c8f0','#00c87a','#f0b800','#f04848','#c040f0','#4080f0'];

// ═══════════════════════════════════════════════════════
// BÜHLMANN TISSUE MATH
// ═══════════════════════════════════════════════════════
function initTissues() {
  const p0 = (SURFACE_P - P_H2O) * 0.7902; // surface N2 loading
  return { n2: Array(16).fill(p0), he: Array(16).fill(0) };
}

function cloneTissues(t) { return { n2: [...t.n2], he: [...t.he] }; }

function stepTissues(tissues, ppN2, ppHe, dtMin) {
  return {
    n2: tissues.n2.map((p, i) => p + (ppN2 - p) * (1 - Math.exp(-Math.LN2 * dtMin / N2_HT[i]))),
    he: tissues.he.map((p, i) => p + (ppHe - p) * (1 - Math.exp(-Math.LN2 * dtMin / HE_HT[i]))),
  };
}

function ceilingBar(tissues, gf) {
  let max = SURFACE_P;
  for (let i = 0; i < 16; i++) {
    const pt = tissues.n2[i] + tissues.he[i];
    if (pt <= 0) continue;
    const a = (N2_A[i] * tissues.n2[i] + HE_A[i] * tissues.he[i]) / pt;
    const b = (N2_B[i] * tissues.n2[i] + HE_B[i] * tissues.he[i]) / pt;
    const c = (pt - a * gf) / (gf / b + 1 - gf);
    if (c > max) max = c;
  }
  return max;
}

function maxTissuePercent(tissues, pamb) {
  // leading tissue saturation as % of GF=1.0 M-value at current ambient
  let max = 0;
  for (let i = 0; i < 16; i++) {
    const pt = tissues.n2[i] + tissues.he[i];
    if (pt <= 0) continue;
    const a = (N2_A[i] * tissues.n2[i] + HE_A[i] * tissues.he[i]) / pt;
    const b = (N2_B[i] * tissues.n2[i] + HE_B[i] * tissues.he[i]) / pt;
    const mv = a + pamb / b;
    const pct = (pt / mv) * 100;
    if (pct > max) max = pct;
  }
  return max;
}

function gfAt(depthM, firstStopDepthM, gfLow, gfHigh) {
  if (firstStopDepthM <= 0) return gfHigh;
  return gfLow + (gfHigh - gfLow) * (1 - depthM / firstStopDepthM);
}

// ═══════════════════════════════════════════════════════
// CNS OXYGEN TRACKING (NOAA table)
// ═══════════════════════════════════════════════════════
function cnsRatePerMin(ppO2) {
  if (ppO2 < 0.5)  return 0;
  if (ppO2 < 0.6)  return 0;
  if (ppO2 < 0.65) return 0.09524;   // 1/1050 min limit
  if (ppO2 < 0.75) return 0.13333;
  if (ppO2 < 0.85) return 0.16667;
  if (ppO2 < 0.95) return 0.23810;
  if (ppO2 < 1.05) return 0.33333;
  if (ppO2 < 1.15) return 0.40000;
  if (ppO2 < 1.25) return 0.50000;
  if (ppO2 < 1.35) return 0.57143;
  if (ppO2 < 1.45) return 0.66667;
  if (ppO2 < 1.55) return 0.80000;
  if (ppO2 < 1.65) return 1.00000;
  return 2.0; // danger zone
}

// ═══════════════════════════════════════════════════════
// DIVE SIMULATION ENGINE
// ═══════════════════════════════════════════════════════

function selectBestDecoGas(decoGases, depth, salt) {
  // Highest fO2 safe at this depth (ppO2 ≤ 1.6)
  const pamb = ambBar(depth, salt);
  let best = null;
  for (const g of decoGases) {
    if (!g || g.fO2 <= 0) continue;
    const ppO2 = (pamb - P_H2O) * g.fO2;
    if (ppO2 > 1.61) continue;
    if (!best || g.fO2 > best.fO2) best = g;
  }
  return best;
}

function buildDecoSchedule(tissues0, startDepth, decoGases, bottomGas, gfLow, gfHigh, salt, ascentRate, mode, setpoint, diluent) {
  let t = cloneTissues(tissues0);
  let depth = startDepth;
  const DT = 1 / 6; // 10-second steps in minutes
  const stops = [];
  let totalTime = 0;
  let cns = 0;

  // Find first stop depth using GF_low
  const ceil0 = ceilingBar(t, gfLow / 100);
  const ceil0m = barToM(ceil0, salt);
  const firstStopDepth = ceil0m > 0 ? Math.ceil(ceil0m / STOP_SIZE) * STOP_SIZE : 0;

  if (firstStopDepth === 0) {
    // No deco — ascend directly
    const ascentTime = depth / ascentRate;
    const steps = Math.max(1, Math.round(ascentTime / DT));
    for (let i = 0; i < steps; i++) {
      const d = depth * (1 - (i + 0.5) / steps);
      const pamb = ambBar(d, salt);
      const gas = (mode === 'ccr') ? bottomGas : (selectBestDecoGas(decoGases, d, salt) || bottomGas);
      const { ppN2, ppHe } = alveolarPP(gas, pamb, mode, setpoint, diluent);
      t = stepTissues(t, ppN2, ppHe, DT);
      const ppO2 = mode === 'ccr' ? Math.min(setpoint, (pamb - P_H2O)) : (pamb - P_H2O) * gas.fO2;
      cns += cnsRatePerMin(ppO2) * DT;
    }
    return { stops: [], totalDecoTime: 0, cns, noDecoNeeded: true };
  }

  // Ascend to first stop
  if (depth > firstStopDepth) {
    const ascentTime = (depth - firstStopDepth) / ascentRate;
    const steps = Math.max(1, Math.round(ascentTime / DT));
    for (let i = 0; i < steps; i++) {
      const d = depth - (depth - firstStopDepth) * (i + 0.5) / steps;
      const pamb = ambBar(d, salt);
      const gas = mode === 'ccr' ? bottomGas : (selectBestDecoGas(decoGases, d, salt) || bottomGas);
      const { ppN2, ppHe } = alveolarPP(gas, pamb, mode, setpoint, diluent);
      t = stepTissues(t, ppN2, ppHe, DT);
      const ppO2 = mode === 'ccr' ? Math.min(setpoint, (pamb - P_H2O)) : (pamb - P_H2O) * gas.fO2;
      cns += cnsRatePerMin(ppO2) * DT;
    }
    depth = firstStopDepth;
  }

  // Work through stops
  let stopDepth = firstStopDepth;
  const MAX_STOP_MIN = 120;

  while (stopDepth > 0) {
    const gas = mode === 'ccr' ? bottomGas : (selectBestDecoGas(decoGases, stopDepth, salt) || bottomGas);
    const pamb = ambBar(stopDepth, salt);
    let stopMin = 0;
    const maxIter = Math.ceil(MAX_STOP_MIN / DT);

    for (let iter = 0; iter < maxIter; iter++) {
      const { ppN2, ppHe } = alveolarPP(gas, pamb, mode, setpoint, diluent);
      t = stepTissues(t, ppN2, ppHe, DT);
      stopMin += DT;
      totalTime += DT;
      const ppO2 = mode === 'ccr' ? Math.min(setpoint, (pamb - P_H2O)) : (pamb - P_H2O) * gas.fO2;
      cns += cnsRatePerMin(ppO2) * DT;

      const nextDepth = stopDepth - STOP_SIZE;
      const nextPamb = nextDepth > 0 ? ambBar(nextDepth, salt) : SURFACE_P;
      // Use GF at the NEXT stop depth — that's the GF that will apply when we get there
      const gfNext = gfAt(Math.max(0, nextDepth), firstStopDepth, gfLow / 100, gfHigh / 100);
      if (ceilingBar(t, gfNext) <= nextPamb + 0.001) break;
    }

    const stopMinRounded = Math.ceil(stopMin);
    if (stopMinRounded > 0) {
      stops.push({ depth: stopDepth, time: stopMinRounded, gas: mode === 'ccr' ? 'Loop' : gasName(gas) });
    }

    // Ascend 3m to next stop
    const nextDepth = stopDepth - STOP_SIZE;
    const ascentTime = STOP_SIZE / ascentRate;
    const steps = Math.max(1, Math.round(ascentTime / DT));
    for (let i = 0; i < steps; i++) {
      const d = stopDepth - STOP_SIZE * (i + 0.5) / steps;
      const pamb2 = ambBar(d, salt);
      const g2 = mode === 'ccr' ? bottomGas : (selectBestDecoGas(decoGases, d, salt) || bottomGas);
      const { ppN2, ppHe } = alveolarPP(g2, pamb2, mode, setpoint, diluent);
      t = stepTissues(t, ppN2, ppHe, DT);
    }
    stopDepth = nextDepth;
  }

  const totalDecoTime = stops.reduce((s, st) => s + st.time, 0);
  return { stops, totalDecoTime, cns: Math.round(cns), noDecoNeeded: false };
}

function runSimulation(config) {
  const { mode, diveMode, waypoints, profileMode, swimSpeed, scooterSpeed,
          bottomGas, decoGases, setpoint, diluent, bailoutGas,
          gfLow, gfHigh, salt, ascentRate, gasDrops,
          bailoutAt, bailoutGasOC,
          sacOC = 20, sacDeco = 15, sacBailout = 25, gasObjects = {} } = config;

  if (!waypoints || waypoints.length < 2) return null;

  const DT = 1 / 6; // 10-second steps
  let tissues = initTissues();
  let cns = 0;
  const gasUsedL = {};
  let bailoutTime = null;
  let xTurnDist = 0; // cave mode turnaround distance from entrance

  // Build the time-depth path
  const path = []; // [{time, depth, dist, inbound}]

  if (profileMode === 'time') {
    // Waypoints are (time, depth) directly — full profile as drawn
    for (let i = 0; i < waypoints.length; i++) {
      path.push({ time: waypoints[i].x, depth: waypoints[i].y, dist: 0, inbound: true });
    }
  } else {
    // Cave mode: waypoints are (dist, depth), convert to time using speeds
    const { mirrorReturn = true } = config;
    let t = 0;
    if (waypoints[0].y > 0) {
      t += waypoints[0].y / (ascentRate * 2);
    }
    path.push({ time: t, depth: waypoints[0].y, dist: waypoints[0].x, inbound: true });
    for (let i = 1; i < waypoints.length; i++) {
      const dx = waypoints[i].x - waypoints[i-1].x;
      const spd = waypoints[i].scooter ? scooterSpeed : swimSpeed;
      t += dx / spd;
      path.push({ time: t, depth: waypoints[i].y, dist: waypoints[i].x, inbound: true });
    }
    if (mirrorReturn) {
      for (let i = waypoints.length - 2; i >= 0; i--) {
        const dx = waypoints[i+1].x - waypoints[i].x;
        const spd = waypoints[i+1].scooter ? scooterSpeed : swimSpeed;
        t += dx / spd;
        path.push({ time: t, depth: waypoints[i].y, dist: waypoints[i].x, inbound: false });
      }
    } else {
      // Full explicit profile (always used via handleCalculate with mirrorReturn:false).
      // Turnaround = middle waypoint by index — robust for Repeat Waypoints profiles.
      // Path points keep their raw odometer as dist; no inbound/outbound transformation.
      xTurnDist = waypoints[Math.floor((waypoints.length - 1) / 2)].x;
    }
  }

  // ─── Shared per-step simulation helper ───────────────────────────────────
  // Takes (depth, dist/odo, curT) and updates tissues/cns/gasUsedL/diveLog.
  let lastStepGasName = diveMode === 'ccr' ? 'Loop' : gasName(bottomGas);
  // gfLineParams is set in Phase 2 so simStep can log the GF ceiling.
  let gfLineParams = null;
  const simStep = (depth, dist, curT, isTravelStep) => {
    const hasBailedOut = diveMode === 'ccr' && bailoutAt != null && (
      profileMode === 'cave' ? (xTurnDist > 0 && dist >= 2 * xTurnDist - bailoutAt) : curT >= bailoutAt
    );
    let activeGas = bottomGas;
    let effectiveMode = diveMode;
    if (hasBailedOut) {
      effectiveMode = 'oc';
      activeGas = bailoutGasOC || bottomGas;
      const availBailout = decoGases.filter(g => !g.dropDist || (xTurnDist > 0 && dist >= 2 * xTurnDist - g.dropDist - 5));
      const bestDeco = selectBestDecoGas(availBailout, depth, salt);
      if (bestDeco) activeGas = bestDeco;
    } else if (diveMode === 'oc') {
      const availGases = decoGases.filter(g => {
        if (!g.dropDist) return true;
        return xTurnDist > 0 && dist >= 2 * xTurnDist - g.dropDist - 5;
      });
      const best = selectBestDecoGas([...availGases, bottomGas], depth, salt);
      if (best) activeGas = best;
    }
    const pamb = ambBar(depth, salt);
    const { ppN2, ppHe } = alveolarPP(activeGas, pamb, effectiveMode, setpoint, diluent);
    tissues = stepTissues(tissues, ppN2, ppHe, DT);
    const ppO2 = effectiveMode === 'ccr'
      ? Math.min(setpoint, pamb - P_H2O)
      : (pamb - P_H2O) * activeGas.fO2;
    cns += cnsRatePerMin(ppO2) * DT;
    if (hasBailedOut && bailoutTime === null) bailoutTime = curT;
    if (hasBailedOut) {
      const name = gasName(activeGas);
      const sac = isTravelStep ? sacBailout : sacDeco;
      gasUsedL[name] = (gasUsedL[name] || 0) + sac * (pamb / SURFACE_P) * DT;
    } else if (diveMode === 'oc') {
      const sac = isTravelStep ? sacOC : sacDeco;
      const name = isTravelStep ? gasName(bottomGas) : gasName(activeGas);
      gasUsedL[name] = (gasUsedL[name] || 0) + sac * (pamb / SURFACE_P) * DT;
    }
    lastStepGasName = effectiveMode === 'ccr' ? 'Loop' : gasName(activeGas);
    logInterval += DT;
    if (logInterval >= 1 || curT === 0) {
      let ceiling = 0;
      if (gfLineParams) {
        const gf = Math.max(gfLineParams.gfLow, Math.min(gfLineParams.gfHigh,
          gfAt(depth, gfLineParams.firstStop, gfLineParams.gfLow, gfLineParams.gfHigh)));
        const cb = ceilingBar(tissues, gf);
        ceiling = cb > SURFACE_P ? Math.max(0, barToM(cb, salt)) : 0;
      }
      diveLog.push({ time: curT, depth, dist, cns: Math.round(cns), ceiling });
      logInterval = 0;
    }
  };

  const diveLog = [];
  let logInterval = 0;
  let exitDepth, bottomTimeMin;
  let curT = 0;

  let caveDecoStops = [];
  let tissuesAtTurn = null, turnDepth = 0;

  if (profileMode === 'cave' && xTurnDist > 0) {
    // ═══ PHASE 1: INBOUND — simulate to turnaround ══════════════════════════
    const turnPathIdx = Math.floor((path.length - 1) / 2);
    const inboundTime = path[turnPathIdx].time;
    let pIdx = 0;

    for (curT = 0; curT <= inboundTime + DT * 0.5; curT += DT) {
      while (pIdx < turnPathIdx && path[pIdx + 1].time <= curT) pIdx++;
      const p1 = path[pIdx];
      const p2 = path[Math.min(pIdx + 1, turnPathIdx)];
      const frac = p2.time > p1.time ? (curT - p1.time) / (p2.time - p1.time) : 0;
      simStep(
        p1.depth + (p2.depth - p1.depth) * frac,
        p1.dist  + (p2.dist  - p1.dist)  * frac,
        curT, true
      );
    }

    // ═══ PHASE 2: RETURN LEG — ceiling-constrained ascent inside cave ══════
    // Snapshot tissues at turnaround — used for the algorithmic deco schedule.
    tissuesAtTurn = cloneTissues(tissues);
    turnDepth = path[turnPathIdx].depth;

    // Anchor the GF line at the GF-low ceiling at turnaround tissues.
    const gfLowFrac = gfLow / 100, gfHighFrac = gfHigh / 100;
    const ceil0Bar = ceilingBar(tissues, gfLowFrac);
    const firstStopDepth = ceil0Bar > SURFACE_P ? Math.max(0, barToM(ceil0Bar, salt)) : 0;
    gfLineParams = { firstStop: firstStopDepth, gfLow: gfLowFrac, gfHigh: gfHighFrac };

    // Build return-leg cave profile from path waypoints after the turnaround.
    const returnWpts = path.slice(turnPathIdx);
    const maxReturnOdo = returnWpts[returnWpts.length - 1].dist;

    // Interpolate cave depth and speed from return waypoints.
    const caveDepthAt = (odo) => {
      for (let i = 0; i < returnWpts.length - 1; i++) {
        if (returnWpts[i].dist <= odo && returnWpts[i + 1].dist >= odo) {
          const f = (odo - returnWpts[i].dist) / (returnWpts[i + 1].dist - returnWpts[i].dist);
          return returnWpts[i].depth + (returnWpts[i + 1].depth - returnWpts[i].depth) * f;
        }
      }
      return returnWpts[returnWpts.length - 1].depth;
    };
    const caveSpeedAt = (odo) => {
      for (let i = 0; i < returnWpts.length - 1; i++) {
        if (returnWpts[i].dist <= odo && returnWpts[i + 1].dist > odo) {
          const dt = returnWpts[i + 1].time - returnWpts[i].time;
          const dx = returnWpts[i + 1].dist - returnWpts[i].dist;
          return dt > 0 ? dx / dt : scooterSpeed;
        }
      }
      const last = returnWpts[returnWpts.length - 1], prev = returnWpts[returnWpts.length - 2] || last;
      const dt = last.time - prev.time, dx = last.dist - prev.dist;
      return dt > 0 ? dx / dt : swimSpeed;
    };

    let returnOdo = xTurnDist;
    let returnDepth = caveDepthAt(returnOdo);

    // Loop: advance through cave or hold for deco; exit when at the surface.
    // Safety guard: cap at ~6 hours of deco to prevent infinite loops from bugs.
    const MAX_RETURN_STEPS = Math.ceil((6 * 60) / DT);
    let returnSteps = 0;
    let deepSectionSnapped = false; // tracks whether we've taken the end-of-deep-section snapshot

    // Track in-cave deco holds to surface them in the results table.
    let caveStopDepth = null, caveStopTime = 0, caveStopGas = null;

    while ((returnOdo < maxReturnOdo || returnDepth > 0.1) && returnSteps++ < MAX_RETURN_STEPS) {
      // Compute GF ceiling at next potential depth.
      const speed = caveSpeedAt(returnOdo);
      const newOdo = Math.min(returnOdo + speed * DT, maxReturnOdo);
      const newCaveD = returnOdo < maxReturnOdo ? caveDepthAt(newOdo) : 0;

      // Snapshot tissues at the end of the deep section — when the cave first starts
      // ascending. This is the max-loading point for the deco schedule.
      if (!deepSectionSnapped && returnOdo < maxReturnOdo && newCaveD < returnDepth - 0.5) {
        tissuesAtTurn = cloneTissues(tissues);
        turnDepth = returnDepth;
        deepSectionSnapped = true;
      }

      // Check if advancing to newCaveD would violate the GF ceiling at that depth.
      const gfNew = Math.max(gfLowFrac, Math.min(gfHighFrac,
        gfAt(newCaveD, firstStopDepth, gfLowFrac, gfHighFrac)));
      const ceilBarNew = ceilingBar(tissues, gfNew);
      const ceilingAtNew = ceilBarNew > SURFACE_P ? Math.max(0, barToM(ceilBarNew, salt)) : 0;

      let stepDepth, stepOdo, isTravelStep;
      if (returnOdo >= maxReturnOdo) {
        // Exited cave — open water ascent to surface constrained by ceiling.
        const gfCur = Math.max(gfLowFrac, Math.min(gfHighFrac,
          gfAt(returnDepth, firstStopDepth, gfLowFrac, gfHighFrac)));
        const ceilCur = Math.max(0, barToM(ceilingBar(tissues, gfCur), salt));
        stepDepth = Math.max(ceilCur, returnDepth - ascentRate * DT);
        if (stepDepth < 0.1 && ceilCur < 0.1) { stepDepth = 0; }
        stepOdo = maxReturnOdo;
        isTravelStep = stepDepth < returnDepth - 0.05; // ascending = travel
      } else if (newCaveD >= ceilingAtNew - 0.5) {
        // Cave at the next odo is at or below the GF ceiling there — advance.
        stepDepth = newCaveD;
        stepOdo = newOdo;
        isTravelStep = true;
      } else {
        // Cave would ascend past the ceiling — hold at current cave depth.
        stepDepth = caveDepthAt(returnOdo);
        stepOdo = returnOdo;
        isTravelStep = false;
      }

      simStep(stepDepth, stepOdo, curT, isTravelStep);

      // Accumulate in-cave deco holds (not open-water, not travel).
      // Bucket to nearest 3m multiple so the table shows standard deco stop depths.
      const holdingInCave = !isTravelStep && returnOdo < maxReturnOdo;
      const roundedD = Math.round(stepDepth / 3) * 3;
      if (holdingInCave) {
        if (caveStopDepth !== roundedD) {
          if (caveStopDepth !== null && caveStopTime > 0)
            caveDecoStops.push({ depth: caveStopDepth, time: Math.ceil(caveStopTime), gas: caveStopGas, inCave: true });
          caveStopDepth = roundedD; caveStopTime = 0; caveStopGas = lastStepGasName;
        }
        caveStopTime += DT;
      } else if (caveStopDepth !== null) {
        if (caveStopTime > 0)
          caveDecoStops.push({ depth: caveStopDepth, time: Math.ceil(caveStopTime), gas: caveStopGas, inCave: true });
        caveStopDepth = null; caveStopTime = 0;
      }

      returnOdo = stepOdo;
      returnDepth = stepDepth;
      curT += DT;
      if (returnDepth <= 0) break;
    }
    // Flush any trailing in-cave stop.
    if (caveStopDepth !== null && caveStopTime > 0)
      caveDecoStops.push({ depth: caveStopDepth, time: Math.ceil(caveStopTime), gas: caveStopGas, inCave: true });

    // Merge repeated stops at the same 3m-multiple depth into one entry.
    const merged = [];
    for (const s of caveDecoStops) {
      const ex = merged.find(m => m.depth === s.depth);
      if (ex) ex.time += s.time;
      else merged.push({ ...s });
    }
    caveDecoStops = merged;

    exitDepth = 0;
    bottomTimeMin = Math.round(curT);

  } else {
    // ═══ TIME MODE (or mirrorReturn=true cave): original single loop ════════
    const totalTime = path[path.length - 1].time;
    let pIdx = 0;

    for (curT = 0; curT <= totalTime + DT * 0.5; curT += DT) {
      while (pIdx < path.length - 2 && path[pIdx + 1].time <= curT) pIdx++;
      const p1 = path[pIdx];
      const p2 = path[Math.min(pIdx + 1, path.length - 1)];
      const frac = p2.time > p1.time ? (curT - p1.time) / (p2.time - p1.time) : 0;
      simStep(
        p1.depth + (p2.depth - p1.depth) * frac,
        p1.dist  + (p2.dist  - p1.dist)  * frac,
        curT, true
      );
    }

    exitDepth = path[path.length - 1].depth;
    bottomTimeMin = Math.round(totalTime);
  }

  // After exit, deco mode: CCR if no bailout, or OC if bailed out
  const exitedAsCCR = diveMode === 'ccr' && bailoutAt == null;
  const allDecoGases = exitedAsCCR
    ? [bottomGas]  // CCR: deco on loop (decoGases are OC bailout only)
    : [...decoGases, (bailoutGasOC || bottomGas)];
  const decoMode = exitedAsCCR ? 'ccr' : 'oc';

  const deco = buildDecoSchedule(
    tissuesAtTurn ?? tissues,
    tissuesAtTurn ? turnDepth : exitDepth,
    allDecoGases,
    exitedAsCCR ? bottomGas : (bailoutGasOC || bottomGas),
    gfLow, gfHigh, salt, ascentRate, decoMode, setpoint, diluent
  );

  // Deco stop gas consumption — only for time/profile mode.
  // Cave mode tracks all gas (including deco holds) per-step in Phase 2; adding it again here would double-count.
  if (profileMode !== 'cave') {
    for (const stop of deco.stops) {
      gasUsedL[stop.gas] = (gasUsedL[stop.gas] || 0) + sacDeco * (ambBar(stop.depth, salt) / SURFACE_P) * stop.time;
    }
  }

  // Build per-gas consumption summary (requires gas size + fill pressure)
  const gasConsumption = {};
  for (const [name, gas] of Object.entries(gasObjects)) {
    if (gas && (gas.size || 0) > 0) {
      const fillPressure = gas.fillPressure || 200;
      const size = gas.size;
      const usedL = Math.round(gasUsedL[name] || 0);
      const endBar = Math.round(fillPressure - usedL / size);
      gasConsumption[name] = { usedL, endBar, startBar: fillPressure, sizeL: size };
    }
  }

  return {
    diveLog,
    decoSchedule: deco,
    caveDecoStops,
    bottomTime: bottomTimeMin,
    totalTime: profileMode === 'cave' ? bottomTimeMin : bottomTimeMin + deco.totalDecoTime,
    maxDepth: Math.max(...path.map(p => p.depth)),
    exitDepth,
    ascentRate,
    turnaroundTime: profileMode === 'time' ? waypoints[waypoints.length - 1].x : (path.find(p => p.dist >= xTurnDist)?.time ?? bottomTimeMin),
    turnaroundDist: xTurnDist,
    bailoutTime,
    diveMode,
    cns: Math.round(cns + deco.cns),
    gasConsumption,
  };
}

// ═══════════════════════════════════════════════════════
// REACT COMPONENTS
// ═══════════════════════════════════════════════════════

function mergeStops(caveStops, owStops) {
  const out = caveStops.map(s => ({ ...s }));
  for (const s of owStops) {
    const ex = out.find(m => m.depth === s.depth);
    if (ex) ex.time += s.time;
    else out.push({ ...s });
  }
  return out;
}

function NumInput({ label, value, onChange, min, max, step = 1, unit, width }) {
  return (
    <div style={width ? { flex: `0 0 ${width}` } : {}}>
      {label && <label>{label}</label>}
      <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
        <input type="number" value={value} min={min} max={max} step={step}
          onChange={e => onChange(Number(e.target.value))}
          style={{ flex: 1 }} />
        {unit && <span style={{ color: 'var(--muted)', fontSize: 11, flexShrink: 0 }}>{unit}</span>}
      </div>
    </div>
  );
}

function GasEditor({ gas, onChange, onRemove, color, showSwitch, showDrop, profileMode }) {
  const updateField = (k, v) => onChange({ ...gas, [k]: v });
  const n2 = Math.max(0, Math.round((1 - gas.fO2 - gas.fHe) * 100));

  return (
    <div className="gas-card">
      <div className="gas-card-header">
        <div className="gas-dot" style={{ background: color }} />
        <span className="gas-name mono">{gasName(gas)}</span>
        <span className="gas-tag" style={{ background: color + '30', color }}>
          N₂ {n2}%
        </span>
        {gasMOD(gas) < 100 && (
          <span className="gas-tag" style={{ background: 'var(--card)', color: 'var(--muted)', marginLeft: 4 }}>
            MOD {gasMOD(gas)}m
          </span>
        )}
        {onRemove && (
          <button className="btn btn-sm btn-danger" onClick={onRemove} style={{ marginLeft: 'auto' }}>✕</button>
        )}
      </div>
      <div className="field-row">
        <NumInput label="O₂ %" value={Math.round(gas.fO2*100)} min={1} max={100}
          onChange={v => updateField('fO2', Math.min(1, v/100))} />
        <NumInput label="He %" value={Math.round(gas.fHe*100)} min={0} max={99}
          onChange={v => updateField('fHe', Math.min(1-gas.fO2, v/100))} />
        <NumInput label="Size L" value={gas.size || 12} min={1} max={40}
          onChange={v => updateField('size', v)} />
        <NumInput label="Fill bar" value={gas.fillPressure || 200} min={50} max={400}
          onChange={v => updateField('fillPressure', v)} />
        <div style={{ fontSize: 10, color: 'var(--muted)', gridColumn: '1 / -1', marginTop: -6 }}>
          Capacity: {((gas.size || 12) * (gas.fillPressure || 200)).toLocaleString()}L
        </div>
      </div>
      {showSwitch && (
        <div className="field-row" style={{ marginTop: 6 }}>
          <NumInput label="Switch depth (m)" value={gas.switchDepth || gasMOD(gas)} min={0} max={100}
            onChange={v => updateField('switchDepth', v)} />
        </div>
      )}
      {showDrop && profileMode === 'cave' && (
        <div className="field-row" style={{ marginTop: 6 }}>
          <NumInput label="Drop at distance (m)" value={gas.dropDist || 0} min={0}
            onChange={v => updateField('dropDist', v)} />
        </div>
      )}
    </div>
  );
}

function CCRPanel({ ccr, onChange, profileMode }) {
  const set = (k, v) => onChange({ ...ccr, [k]: v });
  const setGas = (k, g) => onChange({ ...ccr, [k]: g });

  const addDecoBailout = () => onChange({
    ...ccr,
    decoBailouts: [...(ccr.decoBailouts || []), { fO2: 0.5, fHe: 0, size: 3, fillPressure: 200, switchDepth: 21, dropDist: 0 }]
  });
  const updateDecoBailout = (i, g) => {
    const d = [...(ccr.decoBailouts || [])]; d[i] = g;
    onChange({ ...ccr, decoBailouts: d });
  };
  const removeDecoBailout = (i) => onChange({
    ...ccr, decoBailouts: (ccr.decoBailouts || []).filter((_, j) => j !== i)
  });

  return (
    <>
      <div className="section">
        <div className="section-title">Setpoint</div>
        <div className="field-row">
          <NumInput label="ppO₂ setpoint" value={ccr.setpoint} min={0.5} max={1.6} step={0.05}
            onChange={v => set('setpoint', v)} unit="bar" />
          <NumInput label="Deco setpoint" value={ccr.decoSetpoint} min={0.5} max={1.6} step={0.05}
            onChange={v => set('decoSetpoint', v)} unit="bar" />
        </div>
      </div>
      <div className="section">
        <div className="section-title">Diluent</div>
        <GasEditor gas={ccr.diluent} onChange={g => setGas('diluent', g)} color={GAS_COLORS[0]} />
      </div>
      <div className="section">
        <div className="section-title">OC Bailout Gas</div>
        <GasEditor gas={ccr.bailout} onChange={g => setGas('bailout', g)} color={GAS_COLORS[3]}
          showDrop={true} profileMode={profileMode} />
        <div style={{ marginTop: 8 }}>
          <label>{profileMode === 'cave' ? 'Bail out at distance (m from entrance)' : 'Bail out at time (min)'}</label>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <input type="number" value={ccr.bailoutAt} min={0} placeholder="Leave blank = full CCR dive"
              onChange={e => set('bailoutAt', e.target.value)}
              style={{ flex: 1 }} />
            {ccr.bailoutAt !== '' && (
              <button className="btn btn-sm" onClick={() => set('bailoutAt', '')}>Clear</button>
            )}
          </div>
          <p style={{ fontSize: 11, color: 'var(--muted)', marginTop: 4, lineHeight: 1.5 }}>
            {ccr.bailoutAt === ''
              ? 'Blank = full CCR dive (deco on loop).'
              : `Switches to OC at ${profileMode === 'cave' ? `${ccr.bailoutAt}m` : `${ccr.bailoutAt} min`}. Deco uses bailout gases.`}
          </p>
        </div>
      </div>
      <div className="section">
        <div className="section-title">Deco Bailout Gases</div>
        {(ccr.decoBailouts || []).map((g, i) => (
          <GasEditor key={i} gas={g} onChange={g2 => updateDecoBailout(i, g2)}
            onRemove={(ccr.decoBailouts || []).length > 1 ? () => removeDecoBailout(i) : undefined}
            color={GAS_COLORS[1 + i]} showSwitch={true} showDrop={true} profileMode={profileMode} />
        ))}
        <button className="btn btn-sm" onClick={addDecoBailout} style={{ width: '100%' }}>+ Add Deco Bailout Gas</button>
      </div>
    </>
  );
}

function OCPanel({ oc, onChange, profileMode }) {
  const set = (k, v) => onChange({ ...oc, [k]: v });
  const addDecoGas = () => onChange({
    ...oc, decoGases: [...oc.decoGases, { fO2: 0.5, fHe: 0, size: 3, switchDepth: 21, dropDist: 0 }]
  });
  const updateDecoGas = (i, g) => {
    const d = [...oc.decoGases]; d[i] = g; onChange({ ...oc, decoGases: d });
  };
  const removeDecoGas = (i) => {
    const d = oc.decoGases.filter((_, j) => j !== i); onChange({ ...oc, decoGases: d });
  };

  return (
    <>
      <div className="section">
        <div className="section-title">Bottom Gas</div>
        <GasEditor gas={oc.bottomGas} onChange={g => set('bottomGas', g)} color={GAS_COLORS[0]} />
      </div>
      <div className="section">
        <div className="section-title">Deco Gases</div>
        {oc.decoGases.map((g, i) => (
          <GasEditor key={i} gas={g} onChange={g2 => updateDecoGas(i, g2)}
            onRemove={() => removeDecoGas(i)} color={GAS_COLORS[1 + i]}
            showSwitch={true} showDrop={true} profileMode={profileMode} />
        ))}
        <button className="btn btn-sm" onClick={addDecoGas} style={{ width: '100%' }}>+ Add Deco Gas</button>
      </div>
    </>
  );
}

// ═══════════════════════════════════════════════════════
// CANVAS COMPONENT
// ═══════════════════════════════════════════════════════
function ProfileCanvas({ waypoints, onChange, profileMode, results, gasDrops, decoGases }) {
  const canvasRef = useRef(null);
  const [dragging, setDragging] = useState(null); // index of dragged waypoint
  const [selected, setSelected] = useState(null);
  const [dims, setDims] = useState({ w: 600, h: 300 });
  const containerRef = useRef(null);

  const xLabel = profileMode === 'cave' ? 'Distance (m)' : 'Time (min)';
  const PADDING = { top: 16, right: 24, bottom: 36, left: 50 };

  const maxX = useMemo(() => {
    if (waypoints.length === 0) return profileMode === 'cave' ? 200 : 30;
    const mx = Math.max(...waypoints.map(w => w.x));
    return Math.ceil((mx * 1.1) / (profileMode === 'cave' ? 50 : 5)) * (profileMode === 'cave' ? 50 : 5) || (profileMode === 'cave' ? 100 : 10);
  }, [waypoints, profileMode]);

  const maxY = useMemo(() => {
    if (waypoints.length === 0) return 40;
    const my = Math.max(...waypoints.map(w => w.y));
    return Math.ceil((my * 1.1) / 5) * 5 || 40;
  }, [waypoints]);

  useEffect(() => {
    const obs = new ResizeObserver(entries => {
      const e = entries[0];
      setDims({ w: e.contentRect.width, h: Math.min(320, Math.max(220, e.contentRect.width * 0.42)) });
    });
    if (containerRef.current) obs.observe(containerRef.current);
    return () => obs.disconnect();
  }, []);

  const toCanvas = useCallback((x, y) => ({
    cx: PADDING.left + (x / maxX) * (dims.w - PADDING.left - PADDING.right),
    cy: PADDING.top + (y / maxY) * (dims.h - PADDING.top - PADDING.bottom),
  }), [dims, maxX, maxY, PADDING]);

  const fromCanvas = useCallback((cx, cy) => ({
    x: Math.max(0, ((cx - PADDING.left) / (dims.w - PADDING.left - PADDING.right)) * maxX),
    y: Math.max(0, ((cy - PADDING.top) / (dims.h - PADDING.top - PADDING.bottom)) * maxY),
  }), [dims, maxX, maxY, PADDING]);

  // Draw the canvas
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const { w, h } = dims;
    const isDark = !document.documentElement.dataset.theme || document.documentElement.dataset.theme === 'dark'
      || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light');

    const colors = {
      bg: isDark ? '#141825' : '#ffffff',
      grid: isDark ? '#2a3050' : '#e0e6f0',
      text: isDark ? '#7a88a8' : '#607090',
      profile: isDark ? '#00c8f0' : '#0080a8',
      surface: isDark ? '#1c2235' : '#f0f4fa',
      stop: '#00c87a',
      waypoint: isDark ? '#e0e6f0' : '#1a2040',
    };

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, w, h);

    // Grid
    ctx.strokeStyle = colors.grid;
    ctx.lineWidth = 0.5;
    ctx.setLineDash([]);

    // Horizontal grid lines (depth)
    const depthStep = maxY <= 30 ? 5 : maxY <= 60 ? 10 : 20;
    for (let d = 0; d <= maxY; d += depthStep) {
      const { cy } = toCanvas(0, d);
      ctx.beginPath(); ctx.moveTo(PADDING.left, cy); ctx.lineTo(w - PADDING.right, cy); ctx.stroke();
      ctx.fillStyle = colors.text;
      ctx.font = '10px JetBrains Mono, monospace';
      ctx.textAlign = 'right';
      ctx.fillText(`${d}m`, PADDING.left - 4, cy + 3);
    }

    // Vertical grid lines (dist/time)
    const xStep = profileMode === 'cave'
      ? (maxX <= 100 ? 10 : maxX <= 500 ? 50 : 100)
      : (maxX <= 30 ? 5 : 10);
    for (let x = 0; x <= maxX; x += xStep) {
      const { cx } = toCanvas(x, 0);
      ctx.beginPath(); ctx.moveTo(cx, PADDING.top); ctx.lineTo(cx, h - PADDING.bottom); ctx.stroke();
      ctx.fillStyle = colors.text;
      ctx.textAlign = 'center';
      ctx.fillText(`${x}`, cx, h - PADDING.bottom + 14);
    }

    // Axis labels
    ctx.fillStyle = colors.text;
    ctx.font = '11px Space Grotesk, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(xLabel, w / 2, h - 4);
    ctx.save();
    ctx.translate(12, h / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('Depth (m)', 0, 0);
    ctx.restore();

    // Draw deco stop overlay (from results)
    if (results && results.decoSchedule && results.decoSchedule.stops.length > 0) {
      const stops = results.decoSchedule.stops;
      // For time mode: draw the ascent profile after turnaround
      // For cave mode: show stop depths as markers at the right of the profile
      if (profileMode === 'time') {
        let t = results.turnaroundTime;
        // Draw ascent from turnaround to first stop
        const startDepth = waypoints[waypoints.length-1]?.y || 0;
        const firstStop = stops[0].depth;
        const ascentTime = (startDepth - firstStop) / ASCENT_RATE_DEFAULT;
        const { cx: c1x, cy: c1y } = toCanvas(t, startDepth);
        const { cx: c2x, cy: c2y } = toCanvas(t + ascentTime, firstStop);

        ctx.strokeStyle = '#00c87a';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(c1x, c1y);
        ctx.lineTo(c2x, c2y);
        t += ascentTime;

        for (let i = 0; i < stops.length; i++) {
          const stop = stops[i];
          const { cx: sx, cy: sy } = toCanvas(t, stop.depth);
          const { cx: ex } = toCanvas(t + stop.time, stop.depth);
          ctx.lineTo(sx, sy);
          ctx.moveTo(sx, sy);
          ctx.lineTo(ex, sy);
          t += stop.time;
          if (i < stops.length - 1) {
            const nextDepth = stops[i+1].depth;
            const rTime = (stop.depth - nextDepth) / ASCENT_RATE_DEFAULT;
            const { cx: nx, cy: ny } = toCanvas(t + rTime, nextDepth);
            ctx.lineTo(nx, ny);
            t += rTime;
          }
        }
        // Final ascent to surface
        const lastStop = stops[stops.length-1];
        const finalTime = lastStop.depth / ASCENT_RATE_DEFAULT;
        const { cx: fx, cy: fy } = toCanvas(t + finalTime, 0);
        ctx.lineTo(fx, fy);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // Draw the profile
    if (waypoints.length > 0) {
      ctx.strokeStyle = colors.profile;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([]);
      ctx.beginPath();
      waypoints.forEach((wp, i) => {
        const { cx, cy } = toCanvas(wp.x, wp.y);
        if (i === 0) ctx.moveTo(cx, cy);
        else ctx.lineTo(cx, cy);
      });
      ctx.stroke();

      // Surface line
      const { cx: sx, cy: sy } = toCanvas(0, 0);
      const { cx: ex } = toCanvas(waypoints[0].x, 0);
      ctx.strokeStyle = colors.grid;
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, sy); ctx.stroke();
      ctx.setLineDash([]);

      // Waypoints
      waypoints.forEach((wp, i) => {
        const { cx, cy } = toCanvas(wp.x, wp.y);
        ctx.beginPath();
        ctx.arc(cx, cy, selected === i ? 7 : 5, 0, Math.PI * 2);
        ctx.fillStyle = selected === i ? colors.profile : colors.waypoint;
        ctx.fill();
        ctx.strokeStyle = colors.profile;
        ctx.lineWidth = 2;
        ctx.stroke();
      });
    }

    // Gas drop markers (cave mode)
    if (profileMode === 'cave' && gasDrops) {
      gasDrops.forEach((drop, i) => {
        if (!drop.dist) return;
        const { cx } = toCanvas(drop.dist, 0);
        ctx.strokeStyle = GAS_COLORS[i % GAS_COLORS.length];
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 2]);
        ctx.beginPath();
        ctx.moveTo(cx, PADDING.top);
        ctx.lineTo(cx, dims.h - PADDING.bottom);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = GAS_COLORS[i % GAS_COLORS.length];
        ctx.font = '10px Space Grotesk, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⬦', cx, PADDING.top + 8);
      });
    }

  }, [dims, waypoints, results, profileMode, maxX, maxY, selected, gasDrops, toCanvas, xLabel]);

  const getCanvasPos = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const scaleX = canvasRef.current.width / rect.width;
    const scaleY = canvasRef.current.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      cx: (clientX - rect.left) * scaleX,
      cy: (clientY - rect.top) * scaleY,
    };
  };

  const hitTest = (cx, cy) => {
    for (let i = 0; i < waypoints.length; i++) {
      const { cx: wcx, cy: wcy } = toCanvas(waypoints[i].x, waypoints[i].y);
      if (Math.hypot(cx - wcx, cy - wcy) < 12) return i;
    }
    return -1;
  };

  const handleMouseDown = (e) => {
    e.preventDefault();
    const { cx, cy } = getCanvasPos(e);
    const hit = hitTest(cx, cy);
    if (hit >= 0) {
      setDragging(hit);
      setSelected(hit);
    } else {
      // Add new waypoint
      const { x, y } = fromCanvas(cx, cy);
      const xR = profileMode === 'cave' ? Math.round(x) : Math.round(x * 2) / 2;
      const yR = Math.round(y);
      const newWP = { x: Math.max(0, xR), y: Math.max(0, yR), scooter: false };
      const newWPs = [...waypoints, newWP].sort((a, b) => a.x - b.x);
      onChange(newWPs);
      setSelected(newWPs.findIndex(w => w.x === newWP.x && w.y === newWP.y));
    }
  };

  const handleMouseMove = (e) => {
    if (dragging === null) return;
    e.preventDefault();
    const { cx, cy } = getCanvasPos(e);
    const { x, y } = fromCanvas(cx, cy);
    const xR = profileMode === 'cave' ? Math.round(x) : Math.round(x * 2) / 2;
    const yR = Math.round(y);
    const newWPs = waypoints.map((w, i) =>
      i === dragging ? { ...w, x: Math.max(0, xR), y: Math.max(0, yR) } : w
    ).sort((a, b) => a.x - b.x);
    onChange(newWPs);
  };

  const handleMouseUp = () => setDragging(null);

  const handleKeyDown = (e) => {
    if ((e.key === 'Delete' || e.key === 'Backspace') && selected !== null && waypoints.length > 2) {
      onChange(waypoints.filter((_, i) => i !== selected));
      setSelected(null);
    }
  };

  return (
    <div ref={containerRef} className="canvas-wrap" style={{ outline: 'none' }}
      tabIndex={0} onKeyDown={handleKeyDown}>
      <canvas
        ref={canvasRef}
        width={dims.w}
        height={dims.h}
        onMouseDown={handleMouseDown}
        onMouseMove={handleMouseMove}
        onMouseUp={handleMouseUp}
        onMouseLeave={handleMouseUp}
        onTouchStart={handleMouseDown}
        onTouchMove={handleMouseMove}
        onTouchEnd={handleMouseUp}
        style={{ width: '100%', height: dims.h }}
      />
      <div style={{ position: 'absolute', top: 6, right: 8, fontSize: 10, color: 'var(--muted)' }}>
        Click to add point · Drag to move · Delete key to remove
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// WAYPOINTS TABLE
// ═══════════════════════════════════════════════════════
function WaypointsTable({ waypoints, onChange, profileMode }) {
  const update = (i, k, v) => {
    const nw = waypoints.map((w, j) => j === i ? { ...w, [k]: v } : w);
    onChange(nw);
  };
  const sortByX = () => onChange([...waypoints].sort((a, b) => a.x - b.x));
  const remove = (i) => waypoints.length > 2 && onChange(waypoints.filter((_, j) => j !== i));
  const add = () => {
    const last = waypoints[waypoints.length - 1] || { x: 0, y: 0 };
    const step = profileMode === 'cave' ? 50 : 5;
    onChange([...waypoints, { x: last.x + step, y: last.y, scooter: false }]);
  };

  return (
    <div>
      <div style={{ overflowX: 'auto' }}>
        <table className="data-table">
          <thead>
            <tr>
              <th>{profileMode === 'cave' ? 'Distance (m)' : 'Time (min)'}</th>
              <th>Depth (m)</th>
              {profileMode === 'cave' && <th>Mode</th>}
              <th></th>
            </tr>
          </thead>
          <tbody>
            {waypoints.map((wp, i) => {
              const outOfOrder = profileMode === 'cave' && i > 0 && wp.x < waypoints[i - 1].x;
              return (
              <tr key={i}>
                <td>
                  <input type="text" inputMode="numeric" value={wp.x}
                    style={outOfOrder ? { borderColor: 'var(--danger)' } : {}}
                    onFocus={e => e.target.select()}
                    onChange={e => update(i, 'x', Number(e.target.value) || 0)}
                    onBlur={sortByX} />
                  {outOfOrder && (
                    <div style={{ color: 'var(--danger)', fontSize: 11, marginTop: 3, fontWeight: 600 }}>
                      ⚠ Must be after {waypoints[i - 1].x}m
                    </div>
                  )}
                </td>
                <td>
                  <input type="text" inputMode="numeric" value={wp.y}
                    onFocus={e => e.target.select()}
                    onChange={e => update(i, 'y', Number(e.target.value) || 0)} />
                </td>
                {profileMode === 'cave' && (
                  <td>
                    <select value={wp.scooter ? 'scooter' : 'swim'}
                      onChange={e => update(i, 'scooter', e.target.value === 'scooter')}>
                      <option value="swim">Swim</option>
                      <option value="scooter">Scooter</option>
                    </select>
                  </td>
                )}
                <td>
                  <button className="btn btn-sm btn-danger" onClick={() => remove(i)}
                    disabled={waypoints.length <= 2}>✕</button>
                </td>
              </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <button className="btn btn-sm" onClick={add} style={{ marginTop: 8, width: '100%' }}>+ Add Point</button>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// RESULTS PANEL
// ═══════════════════════════════════════════════════════

function DepthTimeChart({ results, fullWidth = false }) {
  const { diveLog, decoSchedule, caveDecoStops = [], bottomTime, totalTime, maxDepth, exitDepth, ascentRate, turnaroundTime, bailoutTime, diveMode } = results;
  const { stops: owStops } = decoSchedule;
  const stops = [...caveDecoStops, ...owStops];
  if (!diveLog || diveLog.length === 0) return null;

  const W = fullWidth ? 500 : 260, H = fullWidth ? 200 : 130;
  const PAD = { top: 10, right: 10, bottom: 24, left: 32 };
  const cW = W - PAD.left - PAD.right;
  const cH = H - PAD.top - PAD.bottom;
  const yMax = Math.ceil((maxDepth * 1.1) / 10) * 10 || 10;

  const sx = t => PAD.left + (t / totalTime) * cW;
  const sy = d => PAD.top + (d / yMax) * cH;

  // Split diveLog at bailout point for CCR/OC colouring
  const hasBailout = diveMode === 'ccr' && bailoutTime != null;

  // Deco/ascent phase
  const ar = ascentRate || 9;
  const ed = exitDepth ?? diveLog[diveLog.length - 1]?.depth ?? 0;

  // If the cave exit ascent went past the first stop (e.g. cave entrance is at the surface),
  // find the last logged point where the diver was at or below the first stop depth and clip there.
  // This makes the deco line join seamlessly instead of drawing backwards.
  let decoJoinT = bottomTime, decoJoinD = ed;
  if (owStops.length > 0 && ed < owStops[0].depth - 1) {
    const firstStop = owStops[0].depth;
    for (let i = diveLog.length - 1; i >= 0; i--) {
      if (diveLog[i].depth >= firstStop - 1) {
        decoJoinT = diveLog[i].time;
        decoJoinD = firstStop;
        break;
      }
    }
  }

  // For cave dives (ceiling line present), show full diveLog; for OC/time dives clip at decoJoinT.
  const haveCeiling = diveLog.some(p => p.ceiling > 0.1);
  const pathBefore = [], pathAfter = [];
  for (const p of diveLog) {
    if (!haveCeiling && p.time > decoJoinT) continue;
    if (!hasBailout || p.time <= bailoutTime) pathBefore.push(p);
    else pathAfter.push(p);
  }
  if (hasBailout && pathAfter.length > 0) {
    // Add the last CCR point to the start of the OC path for continuity
    const last = pathBefore[pathBefore.length - 1];
    if (last) pathAfter.unshift(last);
  }

  const toPath = pts => pts.map((p, i) =>
    `${i === 0 ? 'M' : 'L'}${sx(p.time).toFixed(1)},${sy(p.depth).toFixed(1)}`
  ).join(' ');

  const logD = toPath(pathBefore);
  const ocD = hasBailout ? toPath(pathAfter) : '';

  let t = decoJoinT, d = decoJoinD;
  // Open-water deco staircase (only remaining OW stops, not cave stops).
  let decoD = '';
  if (owStops.length > 0) {
    const firstStop = owStops[0].depth;
    decoD = `M${sx(t).toFixed(1)},${sy(d).toFixed(1)}`;
    if (Math.abs(d - firstStop) > 0.5) {
      t += Math.abs(d - firstStop) / ar; d = firstStop;
      decoD += ` L${sx(t).toFixed(1)},${sy(d).toFixed(1)}`;
    }
    for (let i = 0; i < owStops.length; i++) {
      t += owStops[i].time; decoD += ` L${sx(t).toFixed(1)},${sy(owStops[i].depth).toFixed(1)}`;
      const nd = i < owStops.length - 1 ? owStops[i + 1].depth : 0;
      t += (owStops[i].depth - nd) / ar; d = nd;
      decoD += ` L${sx(t).toFixed(1)},${sy(d).toFixed(1)}`;
    }
  } else if (ed > 0 && caveDecoStops.length === 0) {
    decoD = `M${sx(t).toFixed(1)},${sy(ed).toFixed(1)}`;
    t += ed / ar;
    decoD += ` L${sx(t).toFixed(1)},${sy(0).toFixed(1)}`;
  }

  // Red GF ceiling line during the return leg (from diveLog ceiling values).
  const ceilPts = diveLog.filter(p => p.time > turnaroundTime && p.ceiling > 0.1);
  const ceilD = ceilPts.length > 1 ? ceilPts.map((p, i) =>
    `${i === 0 ? 'M' : 'L'}${sx(p.time).toFixed(1)},${sy(p.ceiling).toFixed(1)}`
  ).join(' ') : '';

  const depthStep = yMax <= 20 ? 5 : yMax <= 50 ? 10 : yMax <= 100 ? 20 : 30;
  const timeStep = totalTime <= 30 ? 5 : totalTime <= 90 ? 15 : totalTime <= 180 ? 30 : 60;

  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: 'block' }}>
      {Array.from({ length: Math.floor(yMax / depthStep) + 1 }, (_, i) => i * depthStep).map(dep => (
        <g key={dep}>
          <line x1={PAD.left} y1={sy(dep)} x2={W - PAD.right} y2={sy(dep)} stroke="var(--border)" strokeWidth="0.5" />
          <text x={PAD.left - 3} y={sy(dep) + 3} textAnchor="end" fontSize="8" fill="var(--muted)">{dep}</text>
        </g>
      ))}
      {Array.from({ length: Math.floor(totalTime / timeStep) + 1 }, (_, i) => i * timeStep).map(ti => (
        <g key={ti}>
          <line x1={sx(ti)} y1={PAD.top} x2={sx(ti)} y2={H - PAD.bottom} stroke="var(--border)" strokeWidth="0.5" />
          <text x={sx(ti)} y={H - PAD.bottom + 10} textAnchor="middle" fontSize="8" fill="var(--muted)">{ti}</text>
        </g>
      ))}
      {/* CCR (or full OC) bottom phase */}
      {logD && <path d={logD} fill="none" stroke="var(--accent)" strokeWidth="1.5" />}
      {/* OC bailout phase */}
      {ocD && <path d={ocD} fill="none" stroke="#f0a030" strokeWidth="1.5" />}
      {/* GF ceiling during return (red) */}
      {ceilD && <path d={ceilD} fill="none" stroke="rgba(220,60,60,0.65)" strokeWidth="1" strokeDasharray="3,2" />}
      {/* Remaining open-water deco staircase (green) — only for non-cave dives */}
      {!haveCeiling && decoD && <path d={decoD} fill="none" stroke="var(--success)" strokeWidth="1.5" strokeDasharray="4,2" />}
      <text x={W / 2} y={H - 4} textAnchor="middle" fontSize="8" fill="var(--muted)">Time (min)</text>
      <text x={6} y={H / 2} textAnchor="middle" fontSize="8" fill="var(--muted)"
        transform={`rotate(-90, 6, ${H / 2})`}>Depth (m)</text>
      {hasBailout && (
        <g>
          <rect x={PAD.left + 2} y={PAD.top + 2} width={42} height={22} rx="2" fill="var(--surface)" opacity="0.85" />
          <line x1={PAD.left + 6} y1={PAD.top + 10} x2={PAD.left + 16} y2={PAD.top + 10} stroke="var(--accent)" strokeWidth="2" />
          <text x={PAD.left + 19} y={PAD.top + 13} fontSize="7" fill="var(--muted)">CCR</text>
          <line x1={PAD.left + 6} y1={PAD.top + 20} x2={PAD.left + 16} y2={PAD.top + 20} stroke="#f0a030" strokeWidth="2" />
          <text x={PAD.left + 19} y={PAD.top + 23} fontSize="7" fill="var(--muted)">OC</text>
        </g>
      )}
    </svg>
  );
}

function DepthDistChart({ results, fullWidth = false }) {
  const { diveLog, maxDepth, bailoutTime, diveMode, turnaroundDist } = results;
  if (!diveLog || diveLog.length === 0) return null;
  const pts = diveLog.filter(p => p.dist != null);
  if (!pts.length) return null;

  // dist is raw odometer (0 → 2*xTurnDist for a symmetric out-and-back cave).
  // No conversion needed — just use p.dist directly.

  const W = fullWidth ? 500 : 260, H = fullWidth ? 200 : 130;
  const PAD = { top: 10, right: 10, bottom: 24, left: 32 };
  const cW = W - PAD.left - PAD.right;
  const cH = H - PAD.top - PAD.bottom;
  const yMax = Math.ceil((maxDepth * 1.1) / 10) * 10 || 10;
  const xMax = Math.max(...pts.map(p => p.dist)) || 1;

  const sx = x => PAD.left + (x / xMax) * cW;
  const sy = d => PAD.top + (d / yMax) * cH;

  const hasBailout = diveMode === 'ccr' && bailoutTime != null;

  // Split at bailout time for CCR/OC colouring
  const before = [], after = [];
  for (const p of pts) {
    if (!hasBailout || p.time <= bailoutTime) before.push(p);
    else after.push(p);
  }
  if (hasBailout && after.length > 0) {
    const last = before[before.length - 1];
    if (last) after.unshift(last);
  }

  const toPath = ps => ps.map((p, i) =>
    `${i === 0 ? 'M' : 'L'}${sx(p.dist).toFixed(1)},${sy(p.depth).toFixed(1)}`
  ).join(' ');

  const depthStep = yMax <= 20 ? 5 : yMax <= 50 ? 10 : yMax <= 100 ? 20 : 30;
  const distStep = xMax <= 500 ? 100 : xMax <= 2000 ? 500 : 1000;

  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: 'block' }}>
      {Array.from({ length: Math.floor(yMax / depthStep) + 1 }, (_, i) => i * depthStep).map(dep => (
        <g key={dep}>
          <line x1={PAD.left} y1={sy(dep)} x2={W - PAD.right} y2={sy(dep)} stroke="var(--border)" strokeWidth="0.5" />
          <text x={PAD.left - 3} y={sy(dep) + 3} textAnchor="end" fontSize="8" fill="var(--muted)">{dep}</text>
        </g>
      ))}
      {Array.from({ length: Math.floor(xMax / distStep) + 1 }, (_, i) => i * distStep).map(x => (
        <g key={x}>
          <line x1={sx(x)} y1={PAD.top} x2={sx(x)} y2={H - PAD.bottom} stroke="var(--border)" strokeWidth="0.5" />
          <text x={sx(x)} y={H - PAD.bottom + 10} textAnchor="middle" fontSize="8" fill="var(--muted)">{x}</text>
        </g>
      ))}
      <path d={toPath(before)} fill="none" stroke="var(--accent)" strokeWidth="1.5" />
      {hasBailout && after.length > 1 && (
        <path d={toPath(after)} fill="none" stroke="#f0a030" strokeWidth="1.5" />
      )}
      <text x={W / 2} y={H - 4} textAnchor="middle" fontSize="8" fill="var(--muted)">Distance (m)</text>
      <text x={6} y={H / 2} textAnchor="middle" fontSize="8" fill="var(--muted)"
        transform={`rotate(-90, 6, ${H / 2})`}>Depth (m)</text>
    </svg>
  );
}

function DiveTimeline({ results, profileMode }) {
  const { bottomTime, totalTime, turnaroundTime, decoSchedule } = results;
  const { totalDecoTime } = decoSchedule;
  const totalAllDecoTime = totalDecoTime;
  const inbound = Math.round(turnaroundTime);
  const outbound = Math.round(bottomTime - turnaroundTime);
  const segments = [
    { label: 'Inbound',  time: inbound,            color: 'var(--accent)' },
    { label: 'Outbound', time: outbound,            color: '#4080f0' },
    { label: 'Deco',     time: totalAllDecoTime,    color: 'var(--warn)' },
  ].filter(s => s.time > 0);

  return (
    <div className="section">
      <div className="section-title">Timeline</div>
      {segments.map(s => (
        <div key={s.label} style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 7 }}>
          <div style={{ width: 52, fontSize: 11, color: 'var(--muted)', flexShrink: 0 }}>{s.label}</div>
          <div style={{ flex: 1, height: 7, background: 'var(--border)', borderRadius: 4, overflow: 'hidden' }}>
            <div style={{ height: '100%', borderRadius: 4, background: s.color,
              width: `${(s.time / totalTime) * 100}%` }} />
          </div>
          <div className="mono" style={{ fontSize: 12, minWidth: 44, textAlign: 'right' }}>{s.time} min</div>
        </div>
      ))}
    </div>
  );
}

function ResultsPanel({ results, isLoading, profileMode }) {
  if (isLoading) {

  }
  if (!results) {

  const totalAllDecoTime = totalDecoTime;
  const maxStopTime = stops.length > 0 ? Math.max(...stops.map(s => s.time)) : 1;

  const stopColor = (depth) => {
    if (depth <= 6) return 'var(--stop6)';
    if (depth <= 9) return 'var(--stop9)';
    if (depth <= 15) return 'var(--stop12)';
    if (depth <= 21) return 'var(--stop15)';
    if (depth <= 30) return 'var(--stop21)';

            const warn = info.endBar < 100;
            const barColor = low ? 'var(--danger)' : warn ? 'var(--warn)' : 'var(--success)';

function MiniTissueBar({ log }) {
  // Show max tissue loading at turnaround
  const last = log[log.length - 1];
  if (!last) return null;
  return (
    <div style={{ fontSize: 11, color: 'var(--muted)' }}>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(16, 1fr)', gap: 2, marginTop: 4 }}>
        {Array.from({length: 16}, (_, i) => {
          // This is a visual-only indicator; actual % requires running tissues
          const shade = Math.max(0, Math.min(1, i / 15));
          return (
            <div key={i} style={{
              height: 14,
              background: `hsl(${120 - shade * 120}, 70%, 50%)`,
              borderRadius: 2,
              opacity: 0.8,
            }} title={`Compartment ${i+1}`} />

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(16, 1fr)', gap: 2, marginTop: 2 }}>

const STORAGE_KEY = 'cave-deco-settings-v1';
const PROFILES_KEY = 'cave-deco-profiles-v1';

function loadProfiles() {
  try { return JSON.parse(localStorage.getItem(PROFILES_KEY)) || []; } catch { return []; }
}
function saveProfiles(profiles) {
  try { localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles)); } catch {}
}

function SaveModal({ defaultName, onSave, onClose }) {
  const [name, setName] = useState(defaultName || '');
  return (
    <div className="modal-overlay" onMouseDown={onClose}>
      <div className="modal-panel" style={{ maxWidth: 360 }} onMouseDown={e => e.stopPropagation()}>
        <div className="modal-header">
          <h2>Save Profile</h2>
          <button className="btn btn-sm" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <label>Profile name</label>
          <input type="text" value={name} autoFocus placeholder="e.g. Wakulla 50m"
            onChange={e => setName(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && name.trim() && onSave(name.trim())} />
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" disabled={!name.trim()} onClick={() => onSave(name.trim())}>Save</button>
        </div>
      </div>
    </div>
  );
}

function LoadModal({ onLoad, onClose }) {
  const [profiles, setProfiles] = useState(loadProfiles);
  const remove = (id) => {
    const updated = profiles.filter(p => p.id !== id);
    saveProfiles(updated);
    setProfiles(updated);
  };
  const exportAll = async () => {
    const json = JSON.stringify(profiles, null, 2);
    const downloads = window.claude ? await window.claude.use('downloads') : null;
    if (downloads) {
      await downloads.save({ filename: 'cave-deco-profiles.json', data: json });
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      a.download = 'cave-deco-profiles.json';
      a.click();
    }
  };
  const importFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!Array.isArray(imported)) return;
        const existing = loadProfiles();
        const existingIds = new Set(existing.map(p => p.id));
        const merged = [...existing, ...imported.filter(p => !existingIds.has(p.id))];
        saveProfiles(merged);
        setProfiles(merged);
      } catch {}
    };
    reader.readAsText(file);
    e.target.value = '';
  };
  return (
    <div className="modal-overlay" onMouseDown={onClose}>
      <div className="modal-panel" style={{ maxWidth: 440 }} onMouseDown={e => e.stopPropagation()}>
        <div className="modal-header">
          <h2>Load Profile</h2>
          <button className="btn btn-sm" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body" style={{ padding: profiles.length === 0 ? '24px 20px' : '8px 12px' }}>
          {profiles.length === 0 ? (
            <div style={{ color: 'var(--muted)', fontSize: 13, textAlign: 'center' }}>No saved profiles yet.</div>
          ) : profiles.map(p => (
            <div key={p.id} style={{
              display: 'flex', alignItems: 'center', gap: 10,
              padding: '10px 8px', borderBottom: '1px solid var(--border)',
            }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 600, fontSize: 13 }}>{p.name}</div>
                <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 2 }}>
                  {p.diveMode.toUpperCase()} · {p.profileMode === 'cave' ? 'Cave' : 'Time'} · {p.waypoints.length} waypoints · {new Date(p.savedAt).toLocaleDateString()}
                </div>
              </div>
              <button className="btn btn-sm btn-primary" onClick={() => onLoad(p)}>Load</button>
              <button className="btn btn-sm btn-danger" onClick={() => remove(p.id)}>✕</button>
            </div>
          ))}
        </div>
        <div className="modal-footer" style={{ gap: 8 }}>
          <button className="btn" onClick={exportAll} disabled={profiles.length === 0}
            title="Download all profiles as a JSON file">Export</button>
          <label className="btn" style={{ cursor: 'pointer' }} title="Import profiles from a JSON file">
            Import
            <input type="file" accept=".json" style={{ display: 'none' }} onChange={importFile} />
          </label>
          <button className="btn" onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

  descentRate: 18,
  // GF defaults
  gfLow: 50,
  gfHigh: 85,

  ccrDecoSetpoint: 1.3,

  return { ...DEFAULT_SETTINGS };

          <Section title="CCR Setpoints">
            <div className="settings-grid">
              <NumInput label="Bottom setpoint (bar ppO₂)" value={s.ccrSetpoint} min={0.5} max={1.6} step={0.05} onChange={v => set('ccrSetpoint', v)} />
              <NumInput label="Deco setpoint (bar ppO₂)" value={s.ccrDecoSetpoint} min={0.5} max={1.6} step={0.05} onChange={v => set('ccrDecoSetpoint', v)} />
            </div>
          </Section>

          <Section title="SAC / RMV Rates (surface L/min)">
            <div className="settings-grid">
              <NumInput label="OC bottom gas" value={s.sacOC} min={5} max={50} onChange={v => set('sacOC', v)} />
              <NumInput label="OC deco gas" value={s.sacDeco} min={5} max={50} onChange={v => set('sacDeco', v)} />
              <NumInput label="CCR bailout" value={s.sacBailout} min={5} max={50} onChange={v => set('sacBailout', v)} />
            </div>
          </Section>

          <Section title="Gradient Factors (defaults)">
            <div className="settings-grid">
              <NumInput label="GF Low %" value={s.gfLow} min={10} max={100} onChange={v => set('gfLow', v)} />
              <NumInput label="GF High %" value={s.gfHigh} min={10} max={100} onChange={v => set('gfHigh', v)} />
            </div>
          </Section>

          <Section title="ppO₂ Limits">
            <div className="settings-grid">
              <NumInput label="Working limit (bar)" value={s.maxPpO2Work} min={1.0} max={1.6} step={0.05} onChange={v => set('maxPpO2Work', v)} />
              <NumInput label="Deco limit (bar)" value={s.maxPpO2Deco} min={1.0} max={1.6} step={0.05} onChange={v => set('maxPpO2Deco', v)} />
            </div>
          </Section>

          <Section title="Environment">
            <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
              <label style={{ marginBottom: 0, display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
                <input type="radio" name="water" value="salt" checked={s.salt}
                  onChange={() => set('salt', true)} style={{ accentColor: 'var(--accent)' }} />
                Salt water
              </label>
              <label style={{ marginBottom: 0, display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
                <input type="radio" name="water" value="fresh" checked={!s.salt}
                  onChange={() => set('salt', false)} style={{ accentColor: 'var(--accent)' }} />
                Fresh water
              </label>
            </div>
          </Section>
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={() => { onSave(s); onClose(); }}>Save Settings</button>
        </div>
      </div>
    </div>
  );
}

const DEFAULT_OC = {
  bottomGas: { fO2: 0.21, fHe: 0, size: 12, fillPressure: 200 },
  decoGases: [{ fO2: 0.5, fHe: 0, size: 3, switchDepth: 21, dropDist: 0, fillPressure: 200 }],
};

const DEFAULT_CCR = {
  setpoint: 1.3,
  decoSetpoint: 1.3,
  diluent: { fO2: 0.21, fHe: 0, size: 3, fillPressure: 200 },
  bailout: { fO2: 0.21, fHe: 0, size: 7, dropDist: 0, fillPressure: 200 },
  bailoutAt: '',
  decoBailouts: [{ fO2: 0.5, fHe: 0, size: 3, switchDepth: 21, dropDist: 0, fillPressure: 200 }],
};

const DEFAULT_WAYPOINTS_CAVE = [
  { x: 0, y: 5, scooter: false },
  { x: 100, y: 30, scooter: false },
  { x: 300, y: 40, scooter: true },
  { x: 600, y: 50, scooter: true },
];

const DEFAULT_WAYPOINTS_TIME = [
  { x: 0, y: 0 },
  { x: 5, y: 30 },
  { x: 30, y: 40 },
  { x: 45, y: 40 },
];

function App() {
  const [diveMode, setDiveMode] = useState('oc');     // 'oc' | 'ccr'
  const [profileMode, setProfileMode] = useState('cave'); // 'cave' | 'time'
  const [oc, setOc] = useState(DEFAULT_OC);
  const [ccr, setCcr] = useState(DEFAULT_CCR);
  const [waypoints, setWaypoints] = useState(DEFAULT_WAYPOINTS_CAVE);
  const _s = loadSettings();
  const [gfLow, setGfLow] = useState(_s.gfLow);
  const [gfHigh, setGfHigh] = useState(_s.gfHigh);
  const [swimSpeed, setSwimSpeed] = useState(_s.swimSpeed);
  const [scooterSpeed, setScooterSpeed] = useState(_s.scooterSpeed);
  const [ascentRate, setAscentRate] = useState(_s.ascentRate);
  const [salt, setSalt] = useState(_s.salt);
  const [showSettings, setShowSettings] = useState(false);
  const [showSave, setShowSave] = useState(false);
  const [showLoad, setShowLoad] = useState(false);
  const [currentProfileName, setCurrentProfileName] = useState('');
  const [results, setResults] = useState(null);
  const [isCalculating, setIsCalculating] = useState(false);
  const [viewMode, setViewMode] = useState('plan'); // 'plan' | 'results'
  const [panelWidths, setPanelWidths] = useState(() => {
    try { const s = JSON.parse(localStorage.getItem('deco-panel-widths') || '{}'); return { left: s.left || 280, right: s.right || 300 }; }
    catch { return { left: 280, right: 300 }; }
  });

  // Switch profile mode
  const handleProfileMode = (m) => {
    setProfileMode(m);
    setWaypoints(m === 'cave' ? DEFAULT_WAYPOINTS_CAVE : DEFAULT_WAYPOINTS_TIME);
    setResults(null);
  };

  const handleCalculate = useCallback(() => {
    setIsCalculating(true);
    setResults(null);
    setTimeout(() => {
      try {
        const bottomGas = diveMode === 'oc' ? oc.bottomGas : ccr.diluent;
        const decoGases = diveMode === 'oc' ? oc.decoGases : (ccr.decoBailouts || []);
        const gasDrops = diveMode === 'oc'
          ? oc.decoGases.map(g => ({ dist: g.dropDist }))
          : [{ dist: ccr.bailout.dropDist }];

        const s = loadSettings();
        // Build gasObjects map (gasName -> gas object) for consumption tracking
        const gasObjects = {};
        if (diveMode === 'oc') {
          gasObjects[gasName(oc.bottomGas)] = oc.bottomGas;
          oc.decoGases.forEach(g => { gasObjects[gasName(g)] = g; });
        } else {
          gasObjects[gasName(ccr.bailout)] = ccr.bailout;
          (ccr.decoBailouts || []).forEach(g => { gasObjects[gasName(g)] = g; });
        }

        const res = runSimulation({
          diveMode,
          profileMode,
          waypoints,
          swimSpeed,
          scooterSpeed,
          bottomGas,
          decoGases,
          setpoint: ccr.setpoint,
          diluent: ccr.diluent,
          bailoutGas: ccr.bailout,
          bailoutGasOC: ccr.bailout,
          bailoutAt: diveMode === 'ccr' && ccr.bailoutAt !== '' ? Number(ccr.bailoutAt) : null,
          gfLow,
          gfHigh,
          salt,
          ascentRate,
          gasDrops,
          mirrorReturn: false,
          sacOC: s.sacOC,
          sacDeco: s.sacDeco,
          sacBailout: s.sacBailout,
          gasObjects,
        });
        setResults(res);
        if (res) setViewMode('results');
      } catch (e) {
        console.error('Simulation error:', e);
        setResults(null);
      } finally {
        setIsCalculating(false);
      }
    }, 10);
  }, [diveMode, profileMode, waypoints, swimSpeed, scooterSpeed, oc, ccr, gfLow, gfHigh, salt, ascentRate]);

  const gasDrops = diveMode === 'oc'
    ? oc.decoGases.map(g => ({ dist: g.dropDist, name: gasName(g) }))
    : [{ dist: ccr.bailout.dropDist, name: 'Bailout' }];

  function startPanelDrag(side, e) {
    e.preventDefault();
    const startX = e.clientX;
    const startW = panelWidths[side];
    const onMove = (ev) => {
      const delta = ev.clientX - startX;
      const next = Math.max(220, Math.min(520, side === 'left' ? startW + delta : startW - delta));
      setPanelWidths(w => {
        const updated = { ...w, [side]: next };
        try { localStorage.setItem('deco-panel-widths', JSON.stringify(updated)); } catch {}
        return updated;
      });
    };
    const onUp = () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  }

  return (
    <div className="app">
      <header className="header">
        <span className="header-title">⬛ Cave Deco Planner</span>
        <div className="seg-group">
          <button className={`btn ${diveMode === 'oc' ? 'btn-active' : ''}`} onClick={() => { setDiveMode('oc'); setResults(null); }}>OC</button>
          <button className={`btn ${diveMode === 'ccr' ? 'btn-active' : ''}`} onClick={() => { setDiveMode('ccr'); setResults(null); }}>CCR</button>
        </div>
        <div className="seg-group">
          <button className={`btn ${profileMode === 'cave' ? 'btn-active' : ''}`} onClick={() => handleProfileMode('cave')}>Cave Profile</button>
          <button className={`btn ${profileMode === 'time' ? 'btn-active' : ''}`} onClick={() => handleProfileMode('time')}>Time Profile</button>
        </div>
        <div className="header-spacer" />
        {results && (
          <div className="seg-group">
            <button className={`btn ${viewMode === 'plan' ? 'btn-active' : ''}`} onClick={() => setViewMode('plan')}>Plan</button>
            <button className={`btn ${viewMode === 'results' ? 'btn-active' : ''}`} onClick={() => setViewMode('results')}>Results</button>
          </div>
        )}
        <button className="btn" onClick={() => setShowLoad(true)}>📂 Load</button>
        <button className="btn" onClick={() => setShowSave(true)}>💾 Save</button>
        <button className="btn" onClick={() => setShowSettings(true)} title="Settings" style={{ fontSize: 16 }}>⚙</button>
        <button className="btn btn-primary" onClick={handleCalculate} disabled={isCalculating}>
          {isCalculating ? '⚙ Calculating…' : '▶ Calculate'}
        </button>
      </header>
      {showSave && (
        <SaveModal
          defaultName={currentProfileName}
          onSave={name => {
            const profile = { id: Date.now(), name, savedAt: Date.now(), diveMode, profileMode, waypoints, oc, ccr };
            const existing = loadProfiles();
            const idx = existing.findIndex(p => p.name === name);
            const updated = idx >= 0
              ? existing.map((p, i) => i === idx ? profile : p)
              : [profile, ...existing];
            saveProfiles(updated);
            setCurrentProfileName(name);
            setShowSave(false);
          }}
          onClose={() => setShowSave(false)}
        />
      )}
      {showLoad && (
        <LoadModal
          onLoad={p => {
            setDiveMode(p.diveMode);
            setProfileMode(p.profileMode);
            setWaypoints(p.waypoints);
            setOc(p.oc);
            setCcr(p.ccr);
            setCurrentProfileName(p.name);
            setResults(null);
            setShowLoad(false);
          }}
          onClose={() => setShowLoad(false)}
        />
      )}
      {showSettings && (
        <SettingsModal
          settings={loadSettings()}
          onSave={s => {
            persistSettings(s);
            setGfLow(s.gfLow); setGfHigh(s.gfHigh);
            setSwimSpeed(s.swimSpeed); setScooterSpeed(s.scooterSpeed);
            setAscentRate(s.ascentRate); setSalt(s.salt);
            setResults(null);
          }}
          onClose={() => setShowSettings(false)}
        />
      )}

      {viewMode === 'results' && results ? (
        <ResultsView results={results} profileMode={profileMode} isCalculating={isCalculating} onBack={() => setViewMode('plan')} />
      ) : (
      <div className="main" style={{ '--left-w': `${panelWidths.left}px`, '--right-w': `${panelWidths.right}px` }}>
        {/* LEFT: Setup */}
        <div className="panel">
          {diveMode === 'oc'
            ? <OCPanel oc={oc} onChange={setOc} profileMode={profileMode} />
            : <CCRPanel ccr={ccr} onChange={setCcr} profileMode={profileMode} />
          }

        </div>

        <div className="resize-handle" onMouseDown={e => startPanelDrag('left', e)} title="Drag to resize" />

        {/* CENTER: Profile */}
        <div className="panel panel-center">
          <div className="panel-scroll">
            <div style={{ marginBottom: 10 }}>
              <div className="section-title" style={{ marginBottom: 8 }}>
                {profileMode === 'cave' ? 'Cave Profile — Depth vs Distance' : 'Dive Profile — Depth vs Time'}
              </div>
              <ProfileCanvas
                waypoints={waypoints}
                onChange={setWaypoints}
                profileMode={profileMode}
                results={results}
                gasDrops={gasDrops}
              />
            </div>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
              <div className="section-title" style={{ marginBottom: 0 }}>Waypoints</div>
              <button className="btn btn-sm" style={{ color: 'var(--danger)' }} onClick={() => {
                setWaypoints([]);
                setResults(null);
              }}>✕ Clear</button>
            </div>
            <WaypointsTable
              waypoints={waypoints}
              onChange={setWaypoints}
              profileMode={profileMode}
            />
            {profileMode === 'cave' && (
              <div style={{ marginTop: 12 }}>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 6 }}>
                  <button className="btn btn-sm" onClick={() => {
                    const last = waypoints[waypoints.length - 1];
                    const returnWPs = waypoints.slice(0, -1).reverse().map(wp => ({
                      ...wp,
                      x: last.x + (last.x - wp.x),
                    }));
                    setWaypoints([...waypoints, ...returnWPs]);
                    setResults(null);
                  }}>↩ Repeat Waypoints</button>
                  <span style={{ fontSize: 11, color: 'var(--muted)' }}>Appends return leg as explicit waypoints</span>
                </div>
                <p style={{ fontSize: 11, color: 'var(--muted)', lineHeight: 1.5 }}>
                  Draw the cave passage. Set swim/scooter per segment. Gas drops shown as ◆.
                </p>
              </div>
            )}
          </div>
        </div>

      </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
